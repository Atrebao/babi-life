        <rect id="dim" width="360" height="440" fill="#1a1440"/>

        <g id="zzz" transform="translate(88 282)">
          <text x="0" y="0" font-size="13" fill="#fff">Z</text>
          <text x="0" y="0" font-size="17" fill="#fff">Z</text>
          <text x="0" y="0" font-size="21" fill="#fff">Z</text>
        </g>
      </svg>

      <header class="hud" id="hud">
        <div class="hud__row">
          <div class="pill glass" data-stat="argent">
            <span class="coin">F</span>
            <strong class="pill__value" id="val-argent">10 000</strong>
            <span class="pill__unit">FCFA</span>
          </div>
          <div class="pill pill--clock glass">
            <span>☀️</span>
            <strong class="pill__value" id="clock">07:00</strong>
          </div>
        </div>
        <div class="gauges">
          <div class="gauge glass gauge--energie" data-stat="energie">
            <div class="gauge__top">
              <span class="gauge__label">⚡ Énergie</span>
              <strong class="gauge__value" id="val-energie">100</strong>
            </div>
            <div class="gauge__bar"><i id="bar-energie"></i></div>
          </div>
          <div class="gauge glass gauge--sante" data-stat="sante">
            <div class="gauge__top">
              <span class="gauge__label">❤️ Santé</span>
              <strong class="gauge__value" id="val-sante">100</strong>
            </div>
            <div class="gauge__bar"><i id="bar-sante"></i></div>
          </div>
          <div class="gauge glass gauge--respect" data-stat="respect">
            <div class="gauge__top">
              <span class="gauge__label">⭐ Respect</span>
              <strong class="gauge__value" id="val-respect">50</strong>
            </div>
            <div class="gauge__bar"><i id="bar-respect"></i></div>
          </div>
        </div>
      </header>

      <div class="toast" id="toast" role="status" hidden></div>
    </section>

    <section class="panel">
      <div class="dialog" id="dialog">
        <span class="dialog__tag" id="dialog-tag">📍 Yopougon</span>
        <button class="dialog__skip" id="skip-btn" type="button">Passer ⏭</button>
        <div class="dialog__body">
          <svg class="dialog__portrait" viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="24" r="24" fill="#1fbf75"/>
            <path d="M7 48 Q8 36 24 35 Q40 36 41 48 Z" fill="#fff8ef"/>
            <path d="M18 40 L24 44 L30 40" fill="none" stroke="#ff7a00" stroke-width="1.6"/>
            <rect x="20" y="29" width="8" height="7" fill="#5e3a22"/>
            <circle cx="24" cy="22" r="11" fill="#6e4329"/>
            <path d="M13.5 18.5 Q14 8.5 24 8.5 Q34 8.5 34.5 18.5 Z" fill="#fff8ef"/>
            <path d="M15 15 H33 M14.5 17.5 H33.5" stroke="#ff7a00" stroke-width="0.9"/>
            <path d="M14 23 Q15 35 24 35 Q33 35 34 23 Q30 30 24 30 Q18 30 14 23 Z" fill="#d6d3cf"/>
            <circle cx="20" cy="22" r="3.4" fill="none" stroke="#2a2620" stroke-width="1"/>
            <circle cx="28" cy="22" r="3.4" fill="none" stroke="#2a2620" stroke-width="1"/>
            <path d="M23.4 22 H24.6" stroke="#2a2620" stroke-width="1"/>
            <circle cx="20" cy="22" r="1.2" fill="#1a1a1a"/>
            <circle cx="28" cy="22" r="1.2" fill="#1a1a1a"/>
            <path d="M21 28.5 Q24 30.5 27 28.5" fill="none" stroke="#3b1f12" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
          <p class="dialog__text" id="dialog-text" aria-live="polite"></p>
        </div>
        <div class="recap" id="recap" hidden></div>
        <span class="dialog__next" aria-hidden="true">▼</span>
      </div>
      <div class="choices" id="choices"></div>
    </section>

    <div class="creator" id="creator" hidden>
      <form class="id-card" id="creator-form" autocomplete="off">
        <div class="flag"><i></i><i></i><i></i></div>
        <p class="id-card__kicker">République de Babi</p>
        <h2 class="id-card__title">Carte d'identité</h2>
        <div class="id-card__top">
          <div class="id-card__photo">
            <svg viewBox="-26 -66 52 70" aria-hidden="true"><g id="preview-hero" class="hero"></g></svg>
          </div>
          <div class="id-card__info">
            <label class="field">
              <span class="field__label">Prénom</span>
              <input class="field__input" id="name-input" maxlength="14" placeholder="Koffi" enterkeyhint="done">
            </label>
            <div class="field">
              <span class="field__label">Quartier</span>
              <div class="hood">
                <span class="hood__item is-on">Yop</span>
                <span class="hood__item">🔒 Cocody</span>
                <span class="hood__item">🔒 Abobo</span>
              </div>
            </div>
          </div>
        </div>
        <div class="field">
          <span class="field__label">Tu es</span>
          <div class="seg" id="gender-seg">
            <button type="button" data-value="gars">Un gars</button>
            <button type="button" data-value="go">Une go</button>
          </div>
        </div>
        <div class="field">
          <span class="field__label">Teint</span>
          <div class="swatches" id="skin-swatches"></div>
        </div>
        <div class="field">
          <span class="field__label">Tenue</span>
          <div class="swatches" id="outfit-swatches"></div>
        </div>
        <button class="btn btn--play btn--block" type="submit">C'est moi ça&#160;! ✊🏾</button>
      </form>
    </div>

    <div class="title-screen" id="title-screen">
      <div class="title-card">
        <div class="flag"><i></i><i></i><i></i></div>
        <h1 class="title-logo">Babi <span>Life</span></h1>
        <p class="title-tagline">Babi c'est doux… mais faut savoir grouiller.</p>
        <button class="btn btn--play" id="play-btn" type="button">▶ Jouer</button>
        <p class="title-version" id="version"></p>
      </div>
    </div>
  </div>

  <script src="data/dialogues.js"></script>
  <script src="data/scenes.js"></script>
  <script src="script.js"></script>
</body>
</html>
