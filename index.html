<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Babi Life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1 class="logo">Babi<span>Life</span></h1>
      <span class="clock" id="clock">07:00</span>
    </header>

    <section class="stats" aria-label="Jauges">
      <div class="stat stat--money">
        <div class="stat__head">
          <span class="stat__label">💰 Argent</span>
          <span class="stat__value" id="val-argent">10 000 F</span>
        </div>
        <div class="bar"><div class="bar__fill" id="bar-argent"></div></div>
      </div>
      <div class="stat stat--energy">
        <div class="stat__head">
          <span class="stat__label">⚡ Énergie</span>
          <span class="stat__value" id="val-energie">100</span>
        </div>
        <div class="bar"><div class="bar__fill" id="bar-energie"></div></div>
      </div>
      <div class="stat stat--health">
        <div class="stat__head">
          <span class="stat__label">❤️ Santé</span>
          <span class="stat__value" id="val-sante">100</span>
        </div>
        <div class="bar"><div class="bar__fill" id="bar-sante"></div></div>
      </div>
      <div class="stat stat--respect">
        <div class="stat__head">
          <span class="stat__label">⭐ Respect</span>
          <span class="stat__value" id="val-respect">50</span>
        </div>
        <div class="bar"><div class="bar__fill" id="bar-respect"></div></div>
      </div>
    </section>

    <section class="story">
      <span class="story__place" id="place">📍 Yopougon</span>
      <p class="story__text" id="story-text"></p>
      <div class="feedback" id="feedback" hidden></div>
    </section>

    <section class="choices" id="choices"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
