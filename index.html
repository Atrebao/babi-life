        </div>
        <div class="gauges">
          <div class="gauge glass gauge--energie" data-stat="energie">

            </div>
            <div class="gauge__bar"><i id="bar-energie"></i></div>

          <div class="gauge glass gauge--sante" data-stat="sante">

              <span class="gauge__label">❤️ Santé</span>

          <div class="gauge glass gauge--respect" data-stat="respect">
